<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day 💕</title>

<style>
body{
  margin:0;
  font-family: 'Poppins', sans-serif;
  background:linear-gradient(135deg,#ffd6e8,#d9f7ff);
  text-align:center;
  color:#5a245f;
  overflow-x:hidden;
}

.container{
  padding:40px 20px;
}

.teddy{
  font-size:90px;
  animation:bounce 2s infinite;
}

@keyframes bounce{
  50%{transform:translateY(-15px);}
}

h1{
  font-size:42px;
  color:#ff4f9a;
  text-shadow:2px 2px white;
}

.card{
  background:white;
  max-width:500px;
  margin:30px auto;
  padding:25px;
  border-radius:25px;
  box-shadow:0 10px 30px #0002;
}

button{
  background:#ff4f9a;
  color:white;
  border:none;
  padding:15px 30px;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  transform:scale(1.05);
}

.heart{
  position:fixed;
  animation:fall 5s linear infinite;
}

@keyframes fall{
  from{top:-20px;}
  to{top:100vh;}
}
</style>

</head>

<body>

<div class="container">

<div class="teddy">🧸💕</div>

<h1>Happy Friendship Day</h1>

<div class="card">
<h2>For My Special Friend ✨</h2>

<p>
Some friendships are like magic ✨<br>
They make ordinary days beautiful.<br>
Thank you for being a wonderful part of my life 💗
</p>

<button onclick="surprise()">
Click For Surprise 🎁
</button>

<h2 id="msg"></h2>

</div>

</div>


<script>

function surprise(){
document.getElementById("msg").innerHTML=
"🧸💕 You are my forever bestie! 💕🧸";
}

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="💗";
h.style.left=Math.random()*100+"%";
h.style.fontSize=(20+Math.random()*30)+"px";
document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},5000);

},500);

</script>

</body>
</html>
